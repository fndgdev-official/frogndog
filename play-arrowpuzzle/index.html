<!doctype html>
<html lang="en" data-grain="on">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050510">
  <meta name="description" content="Play all 1,000 Arrow Puzzle levels free in your browser. No ads, no account, and automatic local progress saving.">
  <title>Play Arrow Puzzle: Calm Escape — Free | FNDG</title>
  <link rel="canonical" href="https://frogndog.com/play-arrowpuzzle/">
  <link rel="icon" type="image/png" href="../arrowpuzzle/media/icon.png">
  <link rel="stylesheet" href="../site.css">
  <link rel="stylesheet" href="play.css">
  <script defer src="../warp.js"></script>
  <script defer src="build-config.js"></script>
  <script defer src="play.js"></script>
</head>
<body>
  <canvas id="warp" aria-hidden="true"></canvas>
  <div class="mesh" aria-hidden="true"><span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span><span class="blob b4"></span></div>
  <div class="spotlight" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>
  <div class="dust" aria-hidden="true">
    <i style="left:6%;width:3px;height:3px;animation-duration:17s;animation-delay:-2s;--dx:30px"></i>
    <i style="left:14%;width:2px;height:2px;animation-duration:22s;animation-delay:-9s;--dx:-20px"></i>
    <i style="left:22%;width:4px;height:4px;animation-duration:15s;animation-delay:-5s;--dx:18px"></i>
    <i style="left:31%;width:2px;height:2px;animation-duration:24s;animation-delay:-13s;--dx:40px"></i>
    <i style="left:39%;width:3px;height:3px;animation-duration:19s;animation-delay:-1s;--dx:-30px"></i>
    <i style="left:47%;width:2px;height:2px;animation-duration:26s;animation-delay:-16s;--dx:24px"></i>
    <i style="left:55%;width:4px;height:4px;animation-duration:16s;animation-delay:-7s;--dx:-26px"></i>
    <i style="left:63%;width:2px;height:2px;animation-duration:21s;animation-delay:-11s;--dx:16px"></i>
    <i style="left:71%;width:3px;height:3px;animation-duration:18s;animation-delay:-3s;--dx:-18px"></i>
    <i style="left:79%;width:2px;height:2px;animation-duration:25s;animation-delay:-19s;--dx:34px"></i>
    <i style="left:86%;width:4px;height:4px;animation-duration:14s;animation-delay:-6s;--dx:-22px"></i>
    <i style="left:93%;width:2px;height:2px;animation-duration:23s;animation-delay:-14s;--dx:20px"></i>
  </div>
  <header class="play-header">
    <a class="game-info" href="../arrowpuzzle.html"><img src="../arrowpuzzle/media/icon.png" width="28" height="28" alt=""><span>← Game info</span></a>
    <span class="free-badge">Free · No ads</span>
    <a class="studio-link" href="../index.html">FNDG</a>
  </header>
  <main id="game-area">
    <canvas id="unity-canvas" width="432" height="936" tabindex="0" aria-label="Arrow Puzzle: Calm Escape game" aria-hidden="true"></canvas>
    <section id="loading" aria-labelledby="loading-title">
      <img src="../arrowpuzzle/media/icon.png" width="96" height="96" alt="">
      <h1 id="loading-title">Arrow Puzzle</h1>
      <p class="subtitle">Calm Escape</p>
      <p id="status" role="status" aria-live="polite">Loading 1,000 puzzles…</p>
      <progress id="progress" max="1" value="0" aria-label="Game loading"></progress>
      <button id="retry" type="button" hidden>Try again</button>
      <p class="load-note">Tap an arrow to send it on its way.</p>
    </section>
    <div id="notice" role="status" aria-live="polite" hidden></div>
    <noscript><p class="no-script">Enable JavaScript to play. <a href="../arrowpuzzle.html">Back to game info</a></p></noscript>
  </main>
  <footer class="play-footer">
    <p>Progress stays in this browser. Clearing site data erases it. Android saves are separate.</p>
    <a href="../arrowpuzzle/privacy.html" target="_blank" rel="noopener">Privacy</a>
  </footer>
</body>
</html>
