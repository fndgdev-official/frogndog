<script>/* Offline orthographic voxel renderer. Rows run from back to front. */
(function () {
  'use strict';

  const TAU = Math.PI * 2;
  const DEFAULT_YAW = Math.PI / 4;
  const DEFAULT_PITCH = Math.atan(1 / Math.sqrt(2));
  const MIN_PITCH = Math.PI / 12;
  const MAX_PITCH = Math.PI * 4 / 9;
  const clamp = (value, min, max) => Math.max(min, Math.min(max, value));

  function create(canvas, options = {}) {
    if (!canvas || typeof canvas.getContext !== 'function') {
      throw new TypeError('StackRenderer.create needs a canvas.');
    }
    const ctx = canvas.getContext('2d', { alpha: true });
    if (!ctx) throw new Error('Canvas2D unavailable');
    const interactive = Boolean(options.interactive);
    let frontLabel = options.frontLabel || 'Front';
    let grid = Array.from({ length: 4 }, () => Array(4).fill(0));
    let size = 4;
    let maxHeight = 0;
    let yaw = DEFAULT_YAW;
    let pitch = DEFAULT_PITCH;
    let width = 1;
    let height = 1;
    let pixelRatio = 1;

      fixedLabel: '從45度觀察的{size}乘{size}積木底板。共{total}塊，最高{height}層。', orbitLabel: '可以拖曳或使用方向鍵旋轉的積木3D視圖。共{total}塊，最高{height}層。',
      changedCell: '第{row}列第{col}欄，積木{height}塊。', heightLimit: '每個格子最多可以堆{limit}塊積木。', changedSize: '底板已改為{size}乘{size}。', alreadyEmpty: '所有格子都是0，已恢復初始方向。', cleared: '所有積木已清空，並已恢復初始方向。', undone: '已復原上一次操作。', viewReset: '已恢復初始方向。', modeAdd: '新增模式。點選格子新增一塊積木。', modeRemove: '移除模式。點選格子移除一塊積木。', selectedOrbit: '已選擇旋轉視圖。', selectedFixed: '已選擇固定的45度視圖。', graphicsError: '此瀏覽器無法顯示3D圖形。請用最新版瀏覽器開啟。'
    }
  };
  const $ = id => document.getElementById(id);
  const gridElement = $('grid');
  const fixedCanvas = $('fixed-canvas');
  const orbitCanvas = $('orbit-canvas');
  const sizeSelect = $('board-size');
  const undoButton = $('undo');
  const STORAGE_KEY = 'fndg-stacking-blocks-v1';
  const MAX_COLUMN_HEIGHT = 100;
  let locale = LOCALES.includes(document.documentElement.dataset.locale) ? document.documentElement.dataset.locale : 'ko';
  let numberFormat = new Intl.NumberFormat(NUMBER_LOCALES[locale]);
  let size = 4;
  let grid = emptyGrid(size);
  let mode = 1;
  const history = [];
  let cellButtons = [];
  let fixedView = null;
  let orbitView = null;

  function emptyGrid(n) { return Array.from({ length: n }, () => Array(n).fill(0)); }
  function t(key, values = {}) { return WORDS[locale][key].replace(/\{(\w+)\}/g, (_, name) => String(values[name] ?? '')); }
  function n(value) { return numberFormat.format(value); }
  function snapshot() { return { size, grid: grid.map(row => row.slice()) }; }
  function remember() { history.push(snapshot()); if (history.length > 100) history.shift(); }
  function save() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(snapshot())); } catch (_) { /* The board also works without storage. */ } }
  function restore() {
    try {
      const data = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if (!data || !Number.isInteger(data.size) || data.size < 2 || data.size > 10 || !Array.isArray(data.grid) || data.grid.length !== data.size) return;
      if (!data.grid.every(row => Array.isArray(row) && row.length === data.size && row.every(height => Number.isSafeInteger(height) && height >= 0 && height <= MAX_COLUMN_HEIGHT))) return;
      size = data.size;
      grid = data.grid;
    } catch (_) { /* Invalid or unavailable saved data starts an empty board. */ }
  }
  function announce(message) { $('announcement').textContent = message; }
  function makeGrid() {
    gridElement.replaceChildren();
    gridElement.style.setProperty('--size', size);
    $('plan-board').style.setProperty('--size', size);
    gridElement.classList.toggle('dense', size >= 6);
    gridElement.classList.toggle('very-dense', size >= 9);
    $('plan-board').classList.toggle('dense-board', size >= 5);
    $('scroll-hint').hidden = size < 5;
    $('grid-scroll').scrollLeft = 0;
    $('grid-scroll').scrollTop = 0;
    cellButtons = [];
    const fragment = document.createDocumentFragment();
    for (let row = 0; row < size; row++) {
      cellButtons[row] = [];
      for (let col = 0; col < size; col++) {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'cell';
        button.dataset.row = row;
        button.dataset.col = col;
        button.addEventListener('click', event => changeHeight(row, col, event.shiftKey ? -1 : mode, button));
        button.addEventListener('contextmenu', event => { event.preventDefault(); changeHeight(row, col, -1, button); });
        button.addEventListener('keydown', event => {
          const moves = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] };
          if (moves[event.key]) {
            event.preventDefault();
            const [dr, dc] = moves[event.key];
            cellButtons[Math.max(0, Math.min(size - 1, row + dr))][Math.max(0, Math.min(size - 1, col + dc))].focus();
          } else if (event.key === 'Delete' || event.key === 'Backspace' || event.key === '-') {
            event.preventDefault();
            changeHeight(row, col, -1, button);
          }
        });
        cellButtons[row][col] = button;
        fragment.append(button);
      }
    }
    gridElement.append(fragment);
    // Changing size must return the viewport to the back-left of the board.
    $('grid-scroll').scrollLeft = 0;
    $('grid-scroll').scrollTop = 0;
  }
  function changeHeight(row, col, delta, button) {
    if (delta < 0 && grid[row][col] === 0) return;
    if (delta > 0 && grid[row][col] >= MAX_COLUMN_HEIGHT) { announce(t('heightLimit', { limit: n(MAX_COLUMN_HEIGHT) })); return; }
    remember();
    grid[row][col] += delta;
    refresh();
    if (button) {
      button.classList.remove('pop');
      void button.offsetWidth;
      button.classList.add('pop');
    }
    announce(t('changedCell', { row: n(row + 1), col: n(col + 1), height: n(grid[row][col]) }));
  }
  function refresh(render = true) {
    let total = 0;
    let highest = 0;
    for (let row = 0; row < size; row++) for (let col = 0; col < size; col++) {
      const height = grid[row][col];
      const button = cellButtons[row][col];
      button.textContent = n(height);
      button.classList.toggle('filled', height > 0);
      button.setAttribute('aria-label', t('cellLabel', { row: n(row + 1), col: n(col + 1), height: n(height), action: t(mode > 0 ? 'addAction' : 'removeAction') }));
      total += height;
      highest = Math.max(highest, height);
    }
    gridElement.setAttribute('aria-label', t('gridLabel', { size: n(size) }));
    $('total-count').textContent = n(total);
    $('max-height').textContent = n(highest);
    $('size-badge').textContent = `${n(size)} × ${n(size)}`;
    sizeSelect.value = String(size);
    undoButton.disabled = history.length === 0;
    $('fixed-empty').hidden = total > 0;
    $('orbit-empty').hidden = total > 0;
    $('add-mode').setAttribute('aria-pressed', String(mode > 0));
    $('remove-mode').setAttribute('aria-pressed', String(mode < 0));
    $('edit-help').textContent = t(mode > 0 ? 'addHelp' : 'removeHelp');
    fixedCanvas.setAttribute('aria-label', t('fixedLabel', { size: n(size), total: n(total), height: n(highest) }));
    orbitCanvas.setAttribute('aria-label', t('orbitLabel', { total: n(total), height: n(highest) }));
    if (render && fixedView && orbitView) {
      fixedView.setScene(grid);
      orbitView.setScene(grid);
      save();
    }
  }
  function applyLocale(nextLocale, persist = true) {
    if (!LOCALES.includes(nextLocale)) return;
    locale = nextLocale;
    numberFormat = new Intl.NumberFormat(NUMBER_LOCALES[locale]);
    document.documentElement.lang = locale;
    document.documentElement.dataset.locale = locale;
    document.title = `${t('title')} — FNDG`;
    document.querySelector('meta[name="description"]').content = t('description');
    document.querySelectorAll('[data-i18n]').forEach(element => { element.textContent = t(element.dataset.i18n); });
    document.querySelectorAll('[data-i18n-aria]').forEach(element => { element.setAttribute('aria-label', t(element.dataset.i18nAria)); });
    $('language').value = locale;
    sizeSelect.querySelectorAll('option').forEach(option => { const value = Number(option.value); option.textContent = `${n(value)} × ${n(value)}`; });
    $('reset-view').title = t('resetViewHelp');
    $('undo').title = t('undoHelp');
    $('undo').setAttribute('aria-label', t('undoHelp'));
    $('reset').title = t('resetHelp');
    $('announcement').textContent = '';
    if (fixedView) fixedView.setFrontLabel(t('front'));
    if (orbitView) orbitView.setFrontLabel(t('front'));
    refresh(false);
    if (persist) { try { localStorage.setItem('fndg-locale', locale); } catch (_) { /* Language switching also works without storage. */ } }
  }
  restore();
  makeGrid();
  applyLocale(locale);
  try {
    fixedView = window.StackRenderer.create(fixedCanvas, { interactive: false, frontLabel: t('front') });
    orbitView = window.StackRenderer.create(orbitCanvas, { interactive: true, frontLabel: t('front') });
  } catch (_) {
    for (const canvas of [fixedCanvas, orbitCanvas]) {
      const error = document.createElement('p');
      error.className = 'graphics-error';
      error.dataset.i18n = 'graphicsError';
      error.textContent = t('graphicsError');
      canvas.replaceWith(error);
    }
  }
  refresh();
  $('language').addEventListener('change', event => applyLocale(event.target.value));
  window.addEventListener('storage', event => { if (event.key === 'fndg-locale' && LOCALES.includes(event.newValue)) applyLocale(event.newValue, false); });
  $('add-mode').addEventListener('click', () => { mode = 1; refresh(false); announce(t('modeAdd')); });
  $('remove-mode').addEventListener('click', () => { mode = -1; refresh(false); announce(t('modeRemove')); });
  sizeSelect.addEventListener('change', () => {
    const nextSize = Number(sizeSelect.value);
    if (!Number.isInteger(nextSize) || nextSize < 2 || nextSize > 10 || nextSize === size) { sizeSelect.value = String(size); return; }
    remember();
    const nextGrid = emptyGrid(nextSize);
    for (let row = 0; row < Math.min(size, nextSize); row++) for (let col = 0; col < Math.min(size, nextSize); col++) nextGrid[row][col] = grid[row][col];
    size = nextSize;
    grid = nextGrid;
    makeGrid();
    refresh();
    announce(t('changedSize', { size: n(size) }));
  });
  $('reset').addEventListener('click', () => {
    const hadBlocks = grid.some(row => row.some(height => height > 0));
    if (hadBlocks) {
      remember();
      grid = emptyGrid(size);
    }
    mode = 1;
    refresh();
    if (orbitView) orbitView.resetView();
    announce(t(hadBlocks ? 'cleared' : 'alreadyEmpty'));
  });
  undoButton.addEventListener('click', () => {
    if (!history.length) return;
    const previous = history.pop();
    const changedSize = size !== previous.size;
    size = previous.size;
    grid = previous.grid;
    if (changedSize) makeGrid();
    refresh();
    announce(t('undone'));
  });
  $('reset-view').addEventListener('click', () => { if (orbitView) orbitView.resetView(); announce(t('viewReset')); });
})();
</script>
