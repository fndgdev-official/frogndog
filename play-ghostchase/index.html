<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Ghost Chase — Web Play | FNDG</title>
    <!-- Google tag (gtag.js) — GA4 frogndog.com -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-R1ESCDQDS9"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-R1ESCDQDS9');
      gtag('event','web_play_start',{game:'ghostchase'});
    </script>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
      /* FNDG-WEB-STYLE */
      html, body { margin:0; width:100%; height:100%; background:#0b0a12; overflow:hidden; }
      #unity-container, #unity-container.unity-desktop, #unity-container.unity-mobile {
        position:fixed; inset:0; left:0; top:0; transform:none; width:100%; height:100%; height:100dvh;
        box-sizing:border-box; display:flex; justify-content:center; align-items:center;
        padding:calc(env(safe-area-inset-top, 0px) + 8px) calc(env(safe-area-inset-right, 0px) + 8px) calc(env(safe-area-inset-bottom, 0px) + 8px) calc(env(safe-area-inset-left, 0px) + 8px);
      }
      #unity-canvas { display:block; background:#0b0a12; touch-action:none; }
      #unity-footer { display:none; }
      .fndg-back { position:fixed; top:calc(env(safe-area-inset-top, 0px) + 10px); left:calc(env(safe-area-inset-left, 0px) + 10px); z-index:20; font:600 14px/1 system-ui,sans-serif; color:#f5e6bd; text-decoration:none; background:rgba(11,10,18,.75); padding:8px 10px; border-radius:8px; }
    </style>
  </head>
  <body>
    <a class="fndg-back" href="/ghostchase/" title="Ghost Chase official page">← FNDG</a>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width="1080" height="2400" tabindex="0" aria-label="Ghost Chase game" data-release="v53-20260915"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">Ghost Chase</div>
      </div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      // Immutable release paths keep cached V44 pages from mixing old and new Unity files.
      var buildUrl = "Build/releases/v53-1dd70601";
      var loaderUrl = buildUrl + "/WebGL.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/WebGL.data.unityweb",
        frameworkUrl: buildUrl + "/WebGL.framework.js.unityweb",
        codeUrl: buildUrl + "/WebGL.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "FNDG",
        productName: "Ghost Chase",
        productVersion: "1.1.0",
        showBanner: unityShowBanner,
      };

      config.autoSyncPersistentDataPath = true;

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";
      }

      function fitGameCanvas() {
        var container = document.querySelector("#unity-container");
        var style = getComputedStyle(container);
        var width = Math.max(1, container.clientWidth - parseFloat(style.paddingLeft) - parseFloat(style.paddingRight));
        var height = Math.max(1, container.clientHeight - parseFloat(style.paddingTop) - parseFloat(style.paddingBottom));
        var fittedHeight = Math.floor(Math.min(height, width * 2400 / 1080));
        canvas.style.height = fittedHeight + "px";
        canvas.style.width = Math.floor(fittedHeight * 1080 / 2400) + "px";
      }
      fitGameCanvas();
      window.addEventListener("resize", fitGameCanvas);
      if (window.visualViewport) window.visualViewport.addEventListener("resize", fitGameCanvas);
      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          canvas.dataset.ready = "true";
          document.querySelector("#unity-loading-bar").style.display = "none";
          document.querySelector("#unity-fullscreen-button").onclick = () => {
            unityInstance.SetFullscreen(1);
          };
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
